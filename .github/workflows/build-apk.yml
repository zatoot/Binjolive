name: Build Waleed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP and clean Termux-only paths
        run: |
          if [ -f Waleed_Flutter_App_Repaired.zip ]; then
            echo "Extracting Waleed_Flutter_App_Repaired.zip..."
            unzip -q -o Waleed_Flutter_App_Repaired.zip
          elif [ -f Waleed_Repair_Bundle.zip ]; then
            echo "Extracting Waleed_Repair_Bundle.zip..."
            unzip -q -o Waleed_Repair_Bundle.zip
            if [ -d Waleed_Gemini_Repair_Bundle/flutter_app ] && [ ! -d flutter_app ]; then
              mv Waleed_Gemini_Repair_Bundle/flutter_app ./flutter_app
            fi
          fi

          test -f flutter_app/pubspec.yaml

          # 1. Remove Termux-hardcoded local.properties so Flutter regenerates it for Ubuntu
          rm -f flutter_app/android/local.properties

          # 2. Replace Termux-hardcoded gradlew with standard Linux Gradle Wrapper launcher
          cat << 'GRADLEW_EOF' > flutter_app/android/gradlew
          #!/usr/bin/env bash
          set -e
          APP_HOME="$(cd "$(dirname "$0")" && pwd -P)"
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
            JAVACMD="$JAVA_HOME/bin/java"
          else
            JAVACMD="java"
          fi
          exec "$JAVACMD" $JAVA_OPTS $GRADLE_OPTS -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW_EOF
          sed -i 's/^          //' flutter_app/android/gradlew
          chmod +x flutter_app/android/gradlew

          # 3. Remove Termux aapt2 path override and tune Gradle for GitHub runner
          sed -i '/aapt2FromMavenOverride/d' flutter_app/android/gradle.properties
          sed -i 's/org.gradle.workers.max=1/org.gradle.workers.max=4/' flutter_app/android/gradle.properties
          sed -i 's/org.gradle.parallel=false/org.gradle.parallel=true/' flutter_app/android/gradle.properties
          sed -i 's/-Xmx1536m/-Xmx4096m/' flutter_app/android/gradle.properties

          # 4. Use official Google/MavenCentral repos directly on GitHub runner
          sed -i '/maven.aliyun.com/d' flutter_app/android/build.gradle
          sed -i '/maven.aliyun.com/d' flutter_app/android/settings.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Release APK (ARM64)
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: waleed-app-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
